<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      
      .border-base {
        fill: none; rx: 20; ry: 20;
        stroke: #18182c;
        stroke-width: 1.2;
      }
      .border-laser {
        fill: none; rx: 20; ry: 20;
        stroke: url(#laserGrad2);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 200 1350;
        animation: laserTravel 7s linear infinite;
        animation-delay: -2.3s;
      }
      @keyframes laserTravel {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -1550; }
      }

      .card-glow {
        fill: #22d3ee; opacity: 0.07;
        animation: glowBreathe 4.5s ease-in-out infinite;
      }
      @keyframes glowBreathe { 0%,100% { opacity: 0.05; r: 85; } 50% { opacity: 0.11; r: 105; } }

      .icon { font-size: 30px; }

      .label {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 16px;
        fill: #22d3ee; letter-spacing: 0.5px;
      }
      .text {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 13.5px;
        fill: #9898b0; line-height: 1.8;
      }
      .highlight { font-weight: 600; fill: #ffffff; }

      .corner-dot { fill: #22d3ee; opacity: 0.35; }
    </style>

    <linearGradient id="laserGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur2"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="576" height="216" class="card-fill"/>
  <circle cx="60" cy="60" r="90" class="card-glow" filter="url(#blur2)"/>
  
  <!-- Borders: Static base + Smooth Moving Laser Beam -->
  <rect x="2" y="2" width="576" height="216" class="border-base"/>
  <rect x="2" y="2" width="576" height="216" class="border-laser"/>

  <!-- Subtle Corner Dots -->
  <circle cx="20" cy="20" r="2" class="corner-dot"/>
  <circle cx="560" cy="20" r="2" class="corner-dot"/>
  <circle cx="20" cy="200" r="2" class="corner-dot"/>
  <circle cx="560" cy="200" r="2" class="corner-dot"/>

  <!-- Content -->
  <text x="38" y="60" class="icon">🔭</text>
  <text x="80" y="56" class="label">Currently Exploring</text>
  
  <text x="38" y="98" class="text"><tspan class="highlight">Deep learning</tspan> architectures, transformer models,</text>
  <text x="38" y="122" class="text">scalable data pipelines for production deployments, and</text>
  <text x="38" y="146" class="text">integrating intelligent AI/ML systems into real-world</text>
  <text x="38" y="170" class="text">products that solve meaningful problems at scale.</text>
</svg>
