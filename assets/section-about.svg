<svg viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');
    .num { font-family:'Space Mono',monospace; font-weight:700; font-size:11px; fill:url(#ng1); letter-spacing:4px; }
    .title { font-family:'Space Mono',monospace; font-weight:700; font-size:13px; fill:#d0d0f0; letter-spacing:8px; }
    .slash { font-family:'Space Mono',monospace; font-weight:700; font-size:13px; fill:#2a2a45; }

    /* Waveform bars */
    .bar { fill:url(#barG1); animation:barAnim 1.2s ease-in-out infinite; }
    .b1{animation-duration:1.0s;} .b2{animation-duration:1.3s;animation-delay:0.1s;}
    .b3{animation-duration:0.9s;animation-delay:0.2s;} .b4{animation-duration:1.4s;animation-delay:0.3s;}
    .b5{animation-duration:1.1s;animation-delay:0.05s;} .b6{animation-duration:0.8s;animation-delay:0.15s;}
    .b7{animation-duration:1.5s;animation-delay:0.25s;} .b8{animation-duration:1.0s;animation-delay:0.35s;}
    @keyframes barAnim {
      0%,100% { transform:scaleY(0.3); opacity:0.3; }
      50% { transform:scaleY(1); opacity:0.9; }
    }

    /* Dot pulse */
    .pulse-dot { fill:#a78bfa; animation:dp 2s ease-in-out infinite; }
    .pulse-ring { fill:none; stroke:#a78bfa; stroke-width:1; animation:dr 2s ease-out infinite; }
    @keyframes dp { 0%,100%{r:3;opacity:0.4;} 50%{r:4;opacity:1;} }
    @keyframes dr { 0%{r:3;stroke-opacity:0.8;} 100%{r:18;stroke-opacity:0;} }

    /* Line shimmer */
    .line-base { stroke:#111128; stroke-width:1; }
    .line-glow {
      stroke:url(#lineShimmer1); stroke-width:1.5; stroke-linecap:round;
      stroke-dasharray:80 900; stroke-dashoffset:0;
      animation:lineFlow 3s linear infinite;
    }
    @keyframes lineFlow { from{stroke-dashoffset:980;} to{stroke-dashoffset:0;} }
  </style>
  <linearGradient id="ng1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="barG1" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="lineShimmer1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
    <stop offset="40%" stop-color="#a78bfa"/><stop offset="50%" stop-color="#fff" stop-opacity="0.8"/>
    <stop offset="60%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Pulse dot -->
<circle cx="22" cy="32" r="3" class="pulse-ring"/>
<circle cx="22" cy="32" r="3" class="pulse-dot"/>

<!-- Number + labels -->
<text x="40" y="27" class="num">01</text>
<text x="40" y="44" class="title">ABOUT <tspan class="slash">//</tspan></text>

<!-- Waveform visualizer -->
<g transform="translate(170, 14)" style="transform-box:fill-box;transform-origin:center bottom;">
  <rect x="0"  y="0" width="3" height="36" rx="1.5" class="bar b1" style="transform-origin:center bottom;"/>
  <rect x="7"  y="0" width="3" height="36" rx="1.5" class="bar b2" style="transform-origin:center bottom;"/>
  <rect x="14" y="0" width="3" height="36" rx="1.5" class="bar b3" style="transform-origin:center bottom;"/>
  <rect x="21" y="0" width="3" height="36" rx="1.5" class="bar b4" style="transform-origin:center bottom;"/>
  <rect x="28" y="0" width="3" height="36" rx="1.5" class="bar b5" style="transform-origin:center bottom;"/>
  <rect x="35" y="0" width="3" height="36" rx="1.5" class="bar b6" style="transform-origin:center bottom;"/>
  <rect x="42" y="0" width="3" height="36" rx="1.5" class="bar b7" style="transform-origin:center bottom;"/>
  <rect x="49" y="0" width="3" height="36" rx="1.5" class="bar b8" style="transform-origin:center bottom;"/>
</g>

<!-- Line -->
<line x1="240" y1="32" x2="1180" y2="32" class="line-base"/>
<line x1="240" y1="32" x2="1180" y2="32" class="line-glow"/>
</svg>
