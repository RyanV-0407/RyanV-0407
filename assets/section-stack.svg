<svg viewBox="0 0 1200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .section-num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #22d3ee; letter-spacing: 2px; }
      .section-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #e0e0f0; letter-spacing: 4px; text-transform: uppercase; }
      .section-line { stroke: url(#lineGrad2); stroke-width: 1.5; opacity: 0.4; }
    </style>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="50" fill="transparent"/>
  <text x="30" y="32" class="section-num">02</text>
  <text x="70" y="32" class="section-title">// Stack</text>
  <line x1="240" y1="30" x2="1170" y2="30" class="section-line"/>
</svg>
