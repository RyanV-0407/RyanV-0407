<svg viewBox="0 0 1200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap');
      .section-num { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 18px; fill: url(#numGrad2); letter-spacing: 2px; }
      .section-slash { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 18px; fill: #2a2a45; }
      .section-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: #e0e0f0; letter-spacing: 5px; text-transform: uppercase; }
      .line-bg { stroke: #13131f; stroke-width: 1; }
      .line-shimmer { stroke: url(#shimmer2); stroke-width: 2; stroke-linecap: round; animation: shimmer 3.5s linear infinite; }
      @keyframes shimmer { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
      .dot { fill: #22d3ee; animation: dotPulse 2s ease-in-out infinite; }
      @keyframes dotPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
    <linearGradient id="numGrad2"><stop offset="0%" style="stop-color:#22d3ee"/><stop offset="100%" style="stop-color:#f472b6"/></linearGradient>
    <linearGradient id="shimmer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0"/><stop offset="30%" style="stop-color:#22d3ee;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/><stop offset="70%" style="stop-color:#f472b6;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <circle cx="22" cy="30" r="3" class="dot"/>
  <text x="38" y="36" class="section-num">02</text>
  <text x="68" y="36" class="section-slash">//</text>
  <text x="100" y="36" class="section-title">Stack</text>
  <line x1="220" y1="32" x2="1180" y2="32" class="line-bg"/>
  <line x1="220" y1="32" x2="1180" y2="32" class="line-shimmer" stroke-dasharray="100 900"/>
</svg>
