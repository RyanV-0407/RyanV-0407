<svg viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap');
      .section-num {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 18px;
        fill: url(#numGrad2); letter-spacing: 2px;
      }
      .section-slash {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 18px;
        fill: #2a2a45; letter-spacing: 2px;
      }
      .section-title {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px;
        fill: #e0e0f0; letter-spacing: 5px; text-transform: uppercase;
      }

      /* Shimmer Line */
      .line-bg { stroke: #13131f; stroke-width: 1; }
      .line-shimmer {
        stroke: url(#shimmer2);
        stroke-width: 2;
        stroke-linecap: round;
        animation: shimmerFlow 3.2s linear infinite;
      }
      @keyframes shimmerFlow {
        0%   { stroke-dashoffset: 900; }
        100% { stroke-dashoffset: 0; }
      }

      .dot { fill: #22d3ee; animation: dotPulse 2s ease-in-out infinite; }
      .ring { fill: none; stroke: #22d3ee; stroke-width: 1; animation: ringPulse 2s ease-out infinite; }
      @keyframes dotPulse { 0%,100% { opacity: 0.4; r: 3; } 50% { opacity: 1; r: 4; } }
      @keyframes ringPulse { 0% { r: 3; stroke-opacity: 0.8; } 100% { r: 12; stroke-opacity: 0; } }
    </style>

    <linearGradient id="numGrad2"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="barG2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shimmer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Pulse Dot -->
  <circle cx="22" cy="30" r="3" class="ring"/>
  <circle cx="22" cy="30" r="3" class="dot"/>

  <!-- Title & Numbers -->
  <text x="38" y="36" class="section-num">02</text>
  <text x="68" y="36" class="section-slash">//</text>
  <text x="100" y="36" class="section-title">Stack</text>

  <!-- Grounded Music Waveform Visualizer (Native SMIL for 100% GitHub compatibility) -->
  <g transform="translate(195, 0)">
    <rect x="0"  y="30" width="3.5" height="8" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="8;28;12;24;8" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;10;26;14;30" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="7"  y="24" width="3.5" height="14" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="14;34;18;30;14" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="24;4;20;8;24" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="32" width="3.5" height="6" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="6;22;10;18;6" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="32;16;28;20;32" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="21" y="20" width="3.5" height="18" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="18;36;12;32;18" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;2;26;6;20" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="28" width="3.5" height="10" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="10;30;16;26;10" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;8;22;12;28" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="35" y="22" width="3.5" height="16" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="16;34;8;28;16" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;4;30;10;22" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="30" width="3.5" height="8" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="8;26;14;32;8" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;12;24;6;30" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="49" y="24" width="3.5" height="14" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="14;32;10;24;14" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="24;6;28;14;24" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="32" width="3.5" height="6" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="6;20;12;18;6" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="32;18;26;20;32" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="63" y="28" width="3.5" height="10" rx="1.75" fill="url(#barG2)">
      <animate attributeName="height" values="10;28;16;22;10" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;10;22;16;28" dur="0.95s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Flowing Shimmer Line -->
  <line x1="280" y1="30" x2="1180" y2="30" class="line-bg"/>
  <line x1="280" y1="30" x2="1180" y2="30" class="line-shimmer" stroke-dasharray="120 780"/>
</svg>
