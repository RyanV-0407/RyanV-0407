<svg viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap');
      .section-num {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 18px;
        fill: url(#numGrad2); letter-spacing: 2px;
      }
      .section-slash {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 18px;
        fill: #2a2a45; letter-spacing: 2px;
      }
      .section-title {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px;
        fill: #e0e0f0; letter-spacing: 5px; text-transform: uppercase;
      }

      /* Music Equalizer Bars */
      .bar { fill: url(#barG2); animation: barDance 1.2s ease-in-out infinite; }
      .b1 { animation-duration: 1.0s; }
      .b2 { animation-duration: 1.3s; animation-delay: 0.1s; }
      .b3 { animation-duration: 0.85s; animation-delay: 0.2s; }
      .b4 { animation-duration: 1.4s; animation-delay: 0.3s; }
      .b5 { animation-duration: 1.1s; animation-delay: 0.05s; }
      .b6 { animation-duration: 0.75s; animation-delay: 0.15s; }
      .b7 { animation-duration: 1.5s; animation-delay: 0.25s; }
      .b8 { animation-duration: 0.95s; animation-delay: 0.35s; }
      
      @keyframes barDance {
        0%, 100% { transform: scaleY(0.25); opacity: 0.35; }
        50%      { transform: scaleY(1.0);  opacity: 1.0; }
      }

      /* Shimmer Line */
      .line-bg { stroke: #13131f; stroke-width: 1; }
      .line-shimmer {
        stroke: url(#shimmer2);
        stroke-width: 2;
        stroke-linecap: round;
        animation: shimmerFlow 3.2s linear infinite;
      }
      @keyframes shimmerFlow {
        0%   { stroke-dashoffset: 950; }
        100% { stroke-dashoffset: 0; }
      }

      .dot { fill: #22d3ee; animation: dotPulse 2s ease-in-out infinite; }
      .ring { fill: none; stroke: #22d3ee; stroke-width: 1; animation: ringPulse 2s ease-out infinite; }
      @keyframes dotPulse { 0%,100% { opacity: 0.4; r: 3; } 50% { opacity: 1; r: 4; } }
      @keyframes ringPulse { 0% { r: 3; stroke-opacity: 0.8; } 100% { r: 12; stroke-opacity: 0; } }
    </style>

    <linearGradient id="numGrad2"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="barG2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shimmer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Pulse Dot -->
  <circle cx="22" cy="28" r="3" class="ring"/>
  <circle cx="22" cy="28" r="3" class="dot"/>

  <!-- Title & Numbers -->
  <text x="38" y="34" class="section-num">02</text>
  <text x="68" y="34" class="section-slash">//</text>
  <text x="100" y="34" class="section-title">Stack</text>

  <!-- Music Equalizer Visualizer Bars -->
  <g transform="translate(195, 12)" style="transform-box:fill-box;transform-origin:center bottom;">
    <rect x="0"  y="0" width="3" height="32" rx="1.5" class="bar b1" style="transform-origin:center bottom;"/>
    <rect x="7"  y="0" width="3" height="32" rx="1.5" class="bar b2" style="transform-origin:center bottom;"/>
    <rect x="14" y="0" width="3" height="32" rx="1.5" class="bar b3" style="transform-origin:center bottom;"/>
    <rect x="21" y="0" width="3" height="32" rx="1.5" class="bar b4" style="transform-origin:center bottom;"/>
    <rect x="28" y="0" width="3" height="32" rx="1.5" class="bar b5" style="transform-origin:center bottom;"/>
    <rect x="35" y="0" width="3" height="32" rx="1.5" class="bar b6" style="transform-origin:center bottom;"/>
    <rect x="42" y="0" width="3" height="32" rx="1.5" class="bar b7" style="transform-origin:center bottom;"/>
    <rect x="49" y="0" width="3" height="32" rx="1.5" class="bar b8" style="transform-origin:center bottom;"/>
  </g>

  <!-- Flowing Shimmer Line -->
  <line x1="265" y1="28" x2="1180" y2="28" class="line-bg"/>
  <line x1="265" y1="28" x2="1180" y2="28" class="line-shimmer" stroke-dasharray="120 800"/>
</svg>
