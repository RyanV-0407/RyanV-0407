<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;display=swap');

      .bg { fill: #07070d; }

      /* Aurora Blobs */
      .aurora-1 { fill: #7c3aed; opacity: 0.28; animation: aFloat1 16s ease-in-out infinite alternate; }
      .aurora-2 { fill: #0891b2; opacity: 0.25; animation: aFloat2 18s ease-in-out infinite alternate; }
      .aurora-3 { fill: #db2777; opacity: 0.22; animation: aFloat3 14s ease-in-out infinite alternate; }
      .aurora-4 { fill: #4f46e5; opacity: 0.26; animation: aFloat1 20s ease-in-out infinite alternate-reverse; }

      @keyframes aFloat1 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(60px, -30px) scale(1.15); }
        100% { transform: translate(-40px, 40px) scale(0.9); }
      }
      @keyframes aFloat2 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(-50px, 35px) scale(1.1); }
        100% { transform: translate(40px, -30px) scale(0.95); }
      }
      @keyframes aFloat3 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(30px, 40px) scale(1.2); }
        100% { transform: translate(-50px, -20px) scale(0.85); }
      }

      /* Orbiting particles */
      .orbit-particle {
        animation: orbitRun 9s linear infinite;
        transform-origin: 600px 195px;
      }
      .p1 { fill: #a78bfa; }
      .p2 { fill: #22d3ee; animation-delay: -3s; }
      .p3 { fill: #f472b6; animation-delay: -6s; }

      @keyframes orbitRun {
        from { transform: rotate(0deg) translateX(190px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(190px) rotate(-360deg); }
      }

      /* Ambient Orbit Track (very subtle) */
      .orbit-track {
        fill: none; stroke: #1e1e38; stroke-width: 1; stroke-opacity: 0.4;
        stroke-dasharray: 4 8;
      }

      /* Main Name Typography */
      .name-glow {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: url(#nameGrad);
        letter-spacing: -1px;
        opacity: 0.3;
      }
      .name-main {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: #ffffff;
        letter-spacing: -1px;
      }

      /* Accent line with moving light shimmer */
      .accent-track {
        stroke: #18182c; stroke-width: 1.5; stroke-linecap: round;
      }
      .accent-shimmer {
        stroke: url(#lineShimmer); stroke-width: 2; stroke-linecap: round;
        stroke-dasharray: 120 400; animation: shimmerRun 3.2s linear infinite;
      }
      @keyframes shimmerRun {
        0%   { stroke-dashoffset: 520; }
        100% { stroke-dashoffset: 0; }
      }

      /* Tagline */
      .tagline {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #8e8eb4;
        letter-spacing: 4px;
      }

      /* Status Pill */
      .status-pill {
        fill: #0d0d18; stroke: #1e1e38; stroke-width: 1; rx: 14; ry: 14;
      }
      .status-dot {
        fill: #22d3ee; animation: pulseDot 2s ease-in-out infinite;
      }
      .status-ring {
        fill: none; stroke: #22d3ee; stroke-width: 1; animation: pulseRing 2s ease-out infinite;
      }
      @keyframes pulseDot { 0%,100% { r: 3; opacity: 0.6; } 50% { r: 4; opacity: 1; } }
      @keyframes pulseRing { 0% { r: 3; stroke-opacity: 0.8; } 100% { r: 14; stroke-opacity: 0; } }

      .status-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 10.5px;
        fill: #72729a;
        letter-spacing: 2.5px;
      }

      /* Corner Brackets */
      .bracket {
        stroke: #a78bfa; stroke-width: 1.5; fill: none; opacity: 0.4;
      }
      .bracket-r  { stroke: #22d3ee; }
      .bracket-bl { stroke: #f472b6; }
      .bracket-br { stroke: #a78bfa; }
    </style>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="lineShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="auroraBlur"><feGaussianBlur stdDeviation="85"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="heroClip"><rect width="1200" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <!-- Base Background -->
    <rect width="1200" height="400" class="bg"/>

    <!-- Silky Smooth Aurora Mesh (No noise, No pores) -->
    <ellipse cx="240" cy="160" rx="280" ry="200" class="aurora-1" filter="url(#auroraBlur)"/>
    <ellipse cx="960" cy="240" rx="290" ry="210" class="aurora-2" filter="url(#auroraBlur)"/>
    <ellipse cx="600" cy="90"  rx="240" ry="170" class="aurora-3" filter="url(#auroraBlur)"/>
    <ellipse cx="520" cy="320" rx="260" ry="190" class="aurora-4" filter="url(#auroraBlur)"/>

    <!-- Orbit Track & Elegant Orbiting Satellite Particles -->
    <circle cx="600" cy="195" r="190" class="orbit-track"/>
    <circle cx="600" cy="195" r="3.5" class="orbit-particle p1" filter="url(#softGlow)"/>
    <circle cx="600" cy="195" r="3.5" class="orbit-particle p1"/>
    <circle cx="600" cy="195" r="3"   class="orbit-particle p2" filter="url(#softGlow)"/>
    <circle cx="600" cy="195" r="3"   class="orbit-particle p2"/>
    <circle cx="600" cy="195" r="3"   class="orbit-particle p3" filter="url(#softGlow)"/>
    <circle cx="600" cy="195" r="3"   class="orbit-particle p3"/>

    <!-- Subtle Corner Brackets -->
    <polyline points="28,54 28,28 54,28" class="bracket"/>
    <polyline points="1146,28 1172,28 1172,54" class="bracket bracket-r"/>
    <polyline points="28,346 28,372 54,372" class="bracket bracket-bl"/>
    <polyline points="1146,372 1172,372 1172,346" class="bracket bracket-br"/>

    <!-- Name & Glow -->
    <text x="600" y="180" text-anchor="middle" class="name-glow" filter="url(#softGlow)">Vikram Singh Rathour</text>
    <text x="600" y="180" text-anchor="middle" class="name-main">Vikram Singh Rathour</text>

    <!-- Center Accent Line with Flowing Shimmer -->
    <line x1="420" y1="210" x2="780" y2="210" class="accent-track"/>
    <line x1="420" y1="210" x2="780" y2="210" class="accent-shimmer"/>

    <!-- Clean Modern Tagline -->
    <text x="600" y="258" text-anchor="middle" class="tagline">MACHINE LEARNING  ·  DEEP LEARNING  ·  AI BUILDER</text>

    <!-- Status Indicator Pill -->
    <g transform="translate(465, 304)">
      <rect x="0" y="0" width="270" height="30" class="status-pill"/>
      <circle cx="22" cy="15" r="3" class="status-ring"/>
      <circle cx="22" cy="15" r="3" class="status-dot"/>
      <text x="38" y="19" class="status-text">AVAILABLE FOR COLLABORATION</text>
    </g>
  </g>
</svg>
