<svg viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');

      .footer-text {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #5a5a78;
        letter-spacing: 3px;
      }
      .footer-line {
        stroke: url(#footerGrad);
        stroke-width: 1;
        opacity: 0.3;
      }
      .footer-heart {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        fill: #f472b6;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0" />
    </linearGradient>
  </defs>

  <line x1="100" y1="20" x2="1100" y2="20" class="footer-line"/>
  <text x="600" y="55" text-anchor="middle" class="footer-text">LET'S BUILD SOMETHING WORTH SHIPPING</text>
  <text x="600" y="75" text-anchor="middle" class="footer-heart">♥</text>
</svg>
