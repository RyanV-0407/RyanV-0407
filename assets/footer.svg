<svg viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@700&amp;display=swap');

      .footer-quote {
        font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
        fill: url(#quoteGrad); letter-spacing: 6px;
      }
      .footer-sub {
        font-family: 'Space Mono', monospace; font-weight: 700; font-size: 9.5px;
        fill: #4c4c70; letter-spacing: 4px;
      }

      /* Conduits */
      .line-left, .line-right { stroke-width: 1; fill: none; }
      .line-left { stroke: url(#fLineL); }
      .line-right { stroke: url(#fLineR); }

      .glow-packet-l {
        stroke: url(#pktL); stroke-width: 2; stroke-linecap: round;
        stroke-dasharray: 60 450; animation: pktFlowL 3s linear infinite;
      }
      .glow-packet-r {
        stroke: url(#pktR); stroke-width: 2; stroke-linecap: round;
        stroke-dasharray: 60 450; animation: pktFlowR 3s linear infinite;
      }
      @keyframes pktFlowL { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 510; } }
      @keyframes pktFlowR { 0% { stroke-dashoffset: 510; } 100% { stroke-dashoffset: 0; } }

      /* Core reactor */
      .core-ring {
        fill: none; stroke: url(#coreGrad); stroke-width: 1.5;
        animation: coreSpin 6s linear infinite;
        transform-origin: 600px 30px;
      }
      .core-ring-2 {
        fill: none; stroke: #22d3ee; stroke-width: 1; stroke-dasharray: 4 6;
        animation: coreSpinRev 10s linear infinite;
        transform-origin: 600px 30px;
      }
      @keyframes coreSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes coreSpinRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

      .core-dot {
        fill: #f472b6; animation: corePulse 2s ease-in-out infinite;
      }
      @keyframes corePulse { 0%,100% { r: 3; opacity: 0.6; } 50% { r: 5; opacity: 1; } }
    </style>

    <linearGradient id="quoteGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="fLineL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fLineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pktL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pktR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Left / Right Conduits with animated energy packets -->
  <line x1="560" y1="30" x2="60" y2="30" class="line-left"/>
  <line x1="560" y1="30" x2="60" y2="30" class="line-left glow-packet-l"/>

  <line x1="640" y1="30" x2="1140" y2="30" class="line-right"/>
  <line x1="640" y1="30" x2="1140" y2="30" class="line-right glow-packet-r"/>

  <!-- Center Energy Core -->
  <circle cx="600" cy="30" r="14" class="core-ring"/>
  <circle cx="600" cy="30" r="18" class="core-ring-2"/>
  <circle cx="600" cy="30" r="3.5" class="core-dot"/>

  <!-- Text Hierarchy -->
  <text x="600" y="70" text-anchor="middle" class="footer-quote">LET'S BUILD SOMETHING WORTH SHIPPING</text>
  <text x="600" y="92" text-anchor="middle" class="footer-sub">VIKRAM SINGH RATHOUR // ALL SYSTEMS NOMINAL · 2026</text>
</svg>
