<svg viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');

      .footer-text {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 14px;
        fill: url(#footerTextGrad); letter-spacing: 6px;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 11px;
        fill: #4e4e70; letter-spacing: 3px; text-transform: uppercase;
      }

      .line-left, .line-right {
        stroke-width: 1.2; stroke-linecap: round;
      }
      .line-left  { stroke: url(#footerLineL); }
      .line-right { stroke: url(#footerLineR); }

      .shimmer-l {
        stroke: url(#shimmerL); stroke-width: 1.8; stroke-linecap: round;
        stroke-dasharray: 60 300; animation: fShimmerL 3s linear infinite;
      }
      .shimmer-r {
        stroke: url(#shimmerR); stroke-width: 1.8; stroke-linecap: round;
        stroke-dasharray: 60 300; animation: fShimmerR 3s linear infinite;
      }
      @keyframes fShimmerL { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 360; } }
      @keyframes fShimmerR { 0% { stroke-dashoffset: 360; } 100% { stroke-dashoffset: 0; } }

      .center-diamond {
        fill: none; stroke: url(#diamondGrad); stroke-width: 1.5;
        animation: diamondSpin 8s linear infinite;
        transform-origin: 600px 28px;
      }
      @keyframes diamondSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .center-dot {
        fill: #f472b6;
        animation: centerPulse 2s ease-in-out infinite;
      }
      @keyframes centerPulse { 0%,100% { opacity: 0.4; r: 2.5; } 50% { opacity: 1; r: 4; } }
    </style>

    <linearGradient id="footerTextGrad"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="50%" style="stop-color:#22d3ee"/><stop offset="100%" style="stop-color:#f472b6"/></linearGradient>
    <linearGradient id="footerLineL" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.6"/><stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/></linearGradient>
    <linearGradient id="footerLineR" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.6"/><stop offset="100%" style="stop-color:#f472b6;stop-opacity:0"/></linearGradient>
    <linearGradient id="diamondGrad"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="50%" style="stop-color:#22d3ee"/><stop offset="100%" style="stop-color:#f472b6"/></linearGradient>
    
    <linearGradient id="shimmerL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmerR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Lines extending from center -->
  <line x1="560" y1="28" x2="80" y2="28" class="line-left"/>
  <line x1="560" y1="28" x2="80" y2="28" class="line-left shimmer-l"/>

  <line x1="640" y1="28" x2="1120" y2="28" class="line-right"/>
  <line x1="640" y1="28" x2="1120" y2="28" class="line-right shimmer-r"/>

  <!-- Center spinning diamond -->
  <rect x="593" y="21" width="14" height="14" rx="2" class="center-diamond"/>
  <circle cx="600" cy="28" r="3" class="center-dot"/>

  <!-- Text -->
  <text x="600" y="68" text-anchor="middle" class="footer-text">LET'S BUILD SOMETHING WORTH SHIPPING</text>
  <text x="600" y="88" text-anchor="middle" class="sub-text">Vikram Singh Rathour · 2026</text>
</svg>
