<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      .border-base {
        fill: none; rx: 20; ry: 20;
        stroke: #18182c; stroke-width: 1.2;
      }
      .border-laser {
        fill: none; rx: 20; ry: 20;
        stroke: url(#laserGrad4); stroke-width: 2;
        stroke-linecap: round; stroke-dasharray: 200 1350;
        animation: laserTravel 6.8s linear infinite;
      }
      @keyframes laserTravel {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -1550; }
      }
      .card-glow {
        fill: #10b981; opacity: 0.08;
        animation: glowBreathe 4s ease-in-out infinite;
      }
      @keyframes glowBreathe { 0%,100% { opacity: 0.05; r: 85; } 50% { opacity: 0.12; r: 105; } }
      .label {
        font-family: 'Space Mono', 'Inter', monospace; font-weight: 700; font-size: 13px;
        fill: #10b981; letter-spacing: 1.5px;
      }
      .badge-txt {
        font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
        fill: #10b981; letter-spacing: 0.8px;
      }
      .lang-txt {
        font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 700;
        fill: #e2e8f0;
      }
      .lang-pct {
        font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      }
    </style>

    <linearGradient id="laserGrad4" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle class="card-glow" cx="90" cy="110" r="90" filter="url(#glow)"/>

  <!-- Card Background -->
  <rect class="card-fill" x="2" y="2" width="576" height="216"/>

  <!-- Base Border -->
  <rect class="border-base" x="2" y="2" width="576" height="216"/>

  <!-- Animated Laser Border -->
  <rect class="border-laser" x="2" y="2" width="576" height="216" filter="url(#glow)"/>

  <!-- Header: Icon & Category -->
  <g transform="translate(30, 26)">
    <!-- Icon Circle -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#0b2319" stroke="#065f46" stroke-width="1"/>
    <text x="11" y="26" font-size="18">💻</text>

    <!-- Title & Badge -->
    <text class="label" x="52" y="24">LANGUAGE SPECTRUM</text>

    <!-- Badge -->
    <rect x="365" y="6" width="153" height="24" rx="12" fill="#0d2b1f" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="379" cy="18" r="3.5" fill="#10b981"/>
    <text class="badge-txt" x="389" y="21.5">CORE: PYTHON</text>
  </g>

  <!-- Visual Multi-segment Progress Bar -->
  <g transform="translate(30, 80)">
    <!-- Full Track Container -->
    <rect x="0" y="0" width="520" height="12" rx="6" fill="#090918" stroke="#1a1a32" stroke-width="1"/>
    <!-- Python: 45% (width 234) -->
    <rect x="0" y="0" width="234" height="12" rx="6" fill="#38bdf8"/>
    <!-- JavaScript: 37% (width 192, x 234) -->
    <rect x="236" y="0" width="190" height="12" rx="0" fill="#facc15"/>
    <!-- CSS: 7.5% (width 39, x 428) -->
    <rect x="428" y="0" width="38" height="12" rx="0" fill="#a78bfa"/>
    <!-- TypeScript: 6.3% (width 33, x 468) -->
    <rect x="468" y="0" width="32" height="12" rx="0" fill="#3b82f6"/>
    <!-- HTML: 4.4% (width 18, x 502) -->
    <rect x="502" y="0" width="18" height="12" rx="6" fill="#f97316"/>
  </g>

  <!-- 4 Detailed Language Pills -->
  <g transform="translate(30, 110)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#081420" stroke="#164e63" stroke-width="1"/>
      <circle cx="16" cy="19" r="4.5" fill="#38bdf8"/>
      <text class="lang-txt" x="30" y="23">Python</text>
      <text class="lang-pct" x="186" y="23" fill="#38bdf8">45.0%</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(268, 0)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#1c1a0c" stroke="#854d0e" stroke-width="1"/>
      <circle cx="16" cy="19" r="4.5" fill="#facc15"/>
      <text class="lang-txt" x="30" y="23">JavaScript</text>
      <text class="lang-pct" x="186" y="23" fill="#facc15">36.8%</text>
    </g>

    <!-- CSS -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#140f26" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="16" cy="19" r="4.5" fill="#a78bfa"/>
      <text class="lang-txt" x="30" y="23">CSS / Tailwind</text>
      <text class="lang-pct" x="194" y="23" fill="#a78bfa">7.5%</text>
    </g>

    <!-- TypeScript & HTML -->
    <g transform="translate(268, 46)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#0b172a" stroke="#1e3a8a" stroke-width="1"/>
      <circle cx="16" cy="19" r="4.5" fill="#3b82f6"/>
      <text class="lang-txt" x="30" y="23">TypeScript / HTML</text>
      <text class="lang-pct" x="190" y="23" fill="#3b82f6">10.7%</text>
    </g>
  </g>
</svg>
