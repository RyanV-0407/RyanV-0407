<svg viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');

      /* Pill base */
      .pill {
        rx: 22; ry: 22; fill: #0c0c16;
        stroke: #1e1e38; stroke-width: 1;
      }
      .pill-text {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px;
        fill: #c0c0dc; text-anchor: middle; dominant-baseline: central;
      }

      /* Glow variants */
      .glow-p { stroke: #a78bfa; stroke-opacity: 0.5; animation: pillGlow 3s ease-in-out infinite; }
      .glow-c { stroke: #22d3ee; stroke-opacity: 0.5; animation: pillGlow 3s ease-in-out infinite; animation-delay: 1s; }
      .glow-k { stroke: #f472b6; stroke-opacity: 0.5; animation: pillGlow 3s ease-in-out infinite; animation-delay: 2s; }

      @keyframes pillGlow {
        0%, 100% { stroke-opacity: 0.25; }
        50% { stroke-opacity: 0.8; }
      }

      /* Dot indicators */
      .dot-p { fill: #a78bfa; animation: dotFlash 2s ease-in-out infinite; }
      .dot-c { fill: #22d3ee; animation: dotFlash 2s ease-in-out infinite; animation-delay: 0.5s; }
      .dot-k { fill: #f472b6; animation: dotFlash 2s ease-in-out infinite; animation-delay: 1s; }
      @keyframes dotFlash { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

      /* Row labels */
      .row-label {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 10px;
        fill: #3a3a55; letter-spacing: 3px; text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Row 1: Languages and Frameworks -->
  <text x="30" y="30" class="row-label">LANGUAGES &amp; FRAMEWORKS</text>

  <g transform="translate(30, 38)">
    <rect x="0" y="0" width="105" height="38" class="pill glow-p"/>
    <circle cx="22" cy="19" r="4" class="dot-p"/><text x="65" y="19" class="pill-text">Python</text>

    <rect x="115" y="0" width="125" height="38" class="pill glow-p"/>
    <circle cx="137" cy="19" r="4" class="dot-p"/><text x="190" y="19" class="pill-text">TypeScript</text>

    <rect x="250" y="0" width="125" height="38" class="pill glow-p"/>
    <circle cx="272" cy="19" r="4" class="dot-p"/><text x="325" y="19" class="pill-text">JavaScript</text>

    <rect x="385" y="0" width="90" height="38" class="pill glow-c"/>
    <circle cx="405" cy="19" r="4" class="dot-c"/><text x="440" y="19" class="pill-text">React</text>

    <rect x="485" y="0" width="100" height="38" class="pill glow-c"/>
    <circle cx="507" cy="19" r="4" class="dot-c"/><text x="545" y="19" class="pill-text">Next.js</text>

    <rect x="595" y="0" width="100" height="38" class="pill glow-c"/>
    <circle cx="617" cy="19" r="4" class="dot-c"/><text x="655" y="19" class="pill-text">Node.js</text>

    <rect x="705" y="0" width="105" height="38" class="pill glow-k"/>
    <circle cx="727" cy="19" r="4" class="dot-k"/><text x="770" y="19" class="pill-text">Tailwind</text>

    <rect x="820" y="0" width="90" height="38" class="pill glow-k"/>
    <circle cx="842" cy="19" r="4" class="dot-k"/><text x="875" y="19" class="pill-text">Figma</text>
  </g>

  <!-- Row 2: Infrastructure and ML -->
  <text x="30" y="102" class="row-label">INFRASTRUCTURE &amp; ML</text>

  <g transform="translate(30, 108)">
    <rect x="0" y="0" width="120" height="38" class="pill glow-c"/>
    <circle cx="22" cy="19" r="4" class="dot-c"/><text x="72" y="19" class="pill-text">PostgreSQL</text>

    <rect x="130" y="0" width="95" height="38" class="pill glow-c"/>
    <circle cx="152" cy="19" r="4" class="dot-c"/><text x="188" y="19" class="pill-text">MySQL</text>

    <rect x="235" y="0" width="100" height="38" class="pill glow-p"/>
    <circle cx="257" cy="19" r="4" class="dot-p"/><text x="295" y="19" class="pill-text">Docker</text>

    <rect x="345" y="0" width="80" height="38" class="pill glow-p"/>
    <circle cx="365" cy="19" r="4" class="dot-p"/><text x="395" y="19" class="pill-text">AWS</text>

    <rect x="435" y="0" width="75" height="38" class="pill glow-k"/>
    <circle cx="452" cy="19" r="4" class="dot-k"/><text x="483" y="19" class="pill-text">Git</text>

    <rect x="520" y="0" width="85" height="38" class="pill glow-k"/>
    <circle cx="540" cy="19" r="4" class="dot-k"/><text x="573" y="19" class="pill-text">Linux</text>

    <rect x="615" y="0" width="125" height="38" class="pill glow-p"/>
    <circle cx="637" cy="19" r="4" class="dot-p"/><text x="690" y="19" class="pill-text">TensorFlow</text>

    <rect x="750" y="0" width="105" height="38" class="pill glow-c"/>
    <circle cx="772" cy="19" r="4" class="dot-c"/><text x="813" y="19" class="pill-text">PyTorch</text>
  </g>
</svg>
