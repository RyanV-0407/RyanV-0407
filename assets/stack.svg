<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@700&amp;display=swap');

      /* Background and frame */
      .stack-bg { fill: #07070f; rx: 16; ry: 16; }
      .stack-border { fill: none; stroke: #16162e; stroke-width: 1; rx: 16; ry: 16; }
      .stack-border-glow {
        fill: none; stroke: url(#stackBrdGlow); stroke-width: 1.5; rx: 16; ry: 16;
        stroke-dasharray: 200 800; animation: borderFlow 10s linear infinite;
      }
      @keyframes borderFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1000; } }

      /* Category headers */
      .cat-tag { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 9px; letter-spacing: 3px; }
      .cat-01 { fill: #22d3ee; }
      .cat-02 { fill: #a78bfa; }
      .cat-03 { fill: #f472b6; }
      .cat-04 { fill: #10b981; }

      /* Chips */
      .chip-base {
        rx: 10; ry: 10; fill: #0d0d1b; stroke: #1e1e38; stroke-width: 1;
        transition: all 0.3s;
      }
      .chip-text {
        font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px;
        fill: #d8d8f0; dominant-baseline: central;
      }

      /* Glow variants */
      .glow-cyan { stroke: #22d3ee; stroke-opacity: 0.4; }
      .glow-violet { stroke: #a78bfa; stroke-opacity: 0.4; }
      .glow-pink { stroke: #f472b6; stroke-opacity: 0.4; }
      .glow-emerald { stroke: #10b981; stroke-opacity: 0.4; }

      /* Animated LEDs */
      .led { animation: ledPulse 2s ease-in-out infinite; }
      .led-c { fill: #22d3ee; }
      .led-v { fill: #a78bfa; }
      .led-p { fill: #f472b6; }
      .led-e { fill: #10b981; }
      @keyframes ledPulse { 0%,100% { opacity: 0.4; r: 2.5; } 50% { opacity: 1; r: 3.5; } }

      /* Ambient Conduit Bus */
      .conduit { stroke: #121226; stroke-width: 1; fill: none; }
      .conduit-glow {
        stroke: url(#conduitG); stroke-width: 1.5; fill: none; stroke-linecap: round;
        stroke-dasharray: 60 400; animation: conduitFlow 5s linear infinite;
      }
      @keyframes conduitFlow { 0% { stroke-dashoffset: 460; } 100% { stroke-dashoffset: 0; } }

      .corner-dec { stroke: #2a2a50; stroke-width: 1; fill: none; }
    </style>

    <linearGradient id="stackBrdGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="conduitG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="stackAmbient" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#121230" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#07070f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Panel Frame -->
  <rect x="2" y="2" width="1196" height="236" class="stack-bg"/>
  <rect x="2" y="2" width="1196" height="236" fill="url(#stackAmbient)" rx="16" ry="16"/>
  <rect x="2" y="2" width="1196" height="236" class="stack-border"/>
  <rect x="2" y="2" width="1196" height="236" class="stack-border-glow"/>

  <!-- Bus Conduits -->
  <path d="M 28 62 L 1172 62" class="conduit"/>
  <path d="M 28 62 L 1172 62" class="conduit-glow"/>
  <path d="M 28 174 L 1172 174" class="conduit"/>

  <!-- Corner details -->
  <path d="M 12 24 L 12 12 L 24 12" class="corner-dec"/>
  <path d="M 1188 24 L 1188 12 L 1176 12" class="corner-dec"/>
  <path d="M 12 216 L 12 228 L 24 228" class="corner-dec"/>
  <path d="M 1188 216 L 1188 228 L 1176 228" class="corner-dec"/>

  <!-- ════ ROW 1: AI / MACHINE LEARNING & DATA ════ -->
  <g transform="translate(28, 20)">
    <text x="0" y="0" class="cat-tag cat-02">01 // MACHINE INTELLIGENCE &amp; DATA</text>
  </g>

  <g transform="translate(28, 28)">
    <!-- PyTorch -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="110" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">PyTorch</text>
    </g>
    <!-- TensorFlow -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="130" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">TensorFlow</text>
    </g>
    <!-- Scikit-Learn -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="135" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">Scikit-Learn</text>
    </g>
    <!-- HuggingFace -->
    <g transform="translate(405, 0)">
      <rect x="0" y="0" width="135" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">HuggingFace</text>
    </g>
    <!-- Pandas & NumPy -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="145" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">Pandas / NumPy</text>
    </g>
    <!-- LLMs & Agents -->
    <g transform="translate(705, 0)">
      <rect x="0" y="0" width="140" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">LLMs &amp; RAG</text>
    </g>
    <!-- LangChain -->
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="130" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">LangChain</text>
    </g>
    <!-- OpenCV -->
    <g transform="translate(995, 0)">
      <rect x="0" y="0" width="105" height="32" class="chip-base glow-violet"/>
      <circle cx="16" cy="16" r="3" class="led led-v"/><text x="32" y="16" class="chip-text">OpenCV</text>
    </g>
  </g>

  <!-- ════ ROW 2: CORE LANGUAGES & RUNTIMES ════ -->
  <g transform="translate(28, 80)">
    <text x="0" y="0" class="cat-tag cat-01">02 // CORE LANGUAGES &amp; BACKEND</text>
  </g>

  <g transform="translate(28, 88)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="100" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">Python</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="125" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">TypeScript</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="120" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">JavaScript</text>
    </g>
    <!-- FastAPI -->
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="105" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">FastAPI</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="105" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">Node.js</text>
    </g>
    <!-- C++ -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="85" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">C++</text>
    </g>
    <!-- SQL -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="85" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">SQL</text>
    </g>
    <!-- GraphQL / REST -->
    <g transform="translate(795, 0)">
      <rect x="0" y="0" width="140" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">REST / APIs</text>
    </g>
    <!-- Bash -->
    <g transform="translate(945, 0)">
      <rect x="0" y="0" width="90" height="32" class="chip-base glow-cyan"/>
      <circle cx="16" cy="16" r="3" class="led led-c"/><text x="32" y="16" class="chip-text">Bash</text>
    </g>
  </g>

  <!-- ════ ROW 3: MODERN WEB & INTERFACES ════ -->
  <g transform="translate(28, 140)">
    <text x="0" y="0" class="cat-tag cat-03">03 // MODERN WEB &amp; EXPERIENCE</text>
  </g>

  <g transform="translate(28, 148)">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="95" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">React</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(105, 0)">
      <rect x="0" y="0" width="105" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">Next.js</text>
    </g>
    <!-- TailwindCSS -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="125" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">TailwindCSS</text>
    </g>
    <!-- Vite -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="85" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">Vite</text>
    </g>
    <!-- HTML5 / CSS3 -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="130" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">HTML5 / CSS3</text>
    </g>
    <!-- Figma -->
    <g transform="translate(590, 0)">
      <rect x="0" y="0" width="95" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">Figma</text>
    </g>
    <!-- UI / UX -->
    <g transform="translate(695, 0)">
      <rect x="0" y="0" width="105" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">UI / UX</text>
    </g>
    <!-- Responsive -->
    <g transform="translate(810, 0)">
      <rect x="0" y="0" width="125" height="32" class="chip-base glow-pink"/>
      <circle cx="16" cy="16" r="3" class="led led-p"/><text x="32" y="16" class="chip-text">Responsive</text>
    </g>
  </g>

  <!-- ════ ROW 4: CLOUD & INFRASTRUCTURE ════ -->
  <g transform="translate(28, 198)">
    <text x="0" y="0" class="cat-tag cat-04">04 // CLOUD, DATA &amp; DEVOPS</text>
  </g>

  <g transform="translate(28, 204)">
    <!-- PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="125" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">PostgreSQL</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="110" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">MongoDB</text>
    </g>
    <!-- Docker -->
    <g transform="translate(255, 0)">
      <rect x="0" y="0" width="95" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">Docker</text>
    </g>
    <!-- AWS -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="80" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">AWS</text>
    </g>
    <!-- Git & GitHub -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="125" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">Git / GitHub</text>
    </g>
    <!-- Linux -->
    <g transform="translate(585, 0)">
      <rect x="0" y="0" width="85" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">Linux</text>
    </g>
    <!-- CI/CD -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="90" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">CI / CD</text>
    </g>
    <!-- Vector DBs -->
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="125" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">Vector DBs</text>
    </g>
    <!-- Redis -->
    <g transform="translate(915, 0)">
      <rect x="0" y="0" width="85" height="26" rx="8" ry="8" class="chip-base glow-emerald"/>
      <circle cx="14" cy="13" r="2.5" class="led led-e"/><text x="28" y="13" class="chip-text" font-size="11">Redis</text>
    </g>
  </g>
</svg>
