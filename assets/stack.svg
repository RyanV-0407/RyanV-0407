<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');

      .tech-bg { fill: #0d0d18; }
      .tech-border { fill: none; stroke: #1e1e38; stroke-width: 1; rx: 16; ry: 16; }

      .tech-pill {
        rx: 20;
        ry: 20;
        fill: #12121f;
        stroke: #2a2a45;
        stroke-width: 1;
      }
      .tech-text {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #c0c0dc;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .glow-purple { stroke: #a78bfa; stroke-opacity: 0.4; }
      .glow-cyan { stroke: #22d3ee; stroke-opacity: 0.4; }
      .glow-pink { stroke: #f472b6; stroke-opacity: 0.4; }

      .dot-purple { fill: #a78bfa; }
      .dot-cyan { fill: #22d3ee; }
      .dot-pink { fill: #f472b6; }
    </style>
  </defs>

  <!-- Row 1: Core languages & frameworks -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="100" height="36" class="tech-pill glow-purple"/>
    <circle cx="20" cy="18" r="4" class="dot-purple"/>
    <text x="60" y="18" class="tech-text">Python</text>

    <rect x="115" y="0" width="120" height="36" class="tech-pill glow-purple"/>
    <circle cx="135" cy="18" r="4" class="dot-purple"/>
    <text x="185" y="18" class="tech-text">TypeScript</text>

    <rect x="250" y="0" width="120" height="36" class="tech-pill glow-purple"/>
    <circle cx="270" cy="18" r="4" class="dot-purple"/>
    <text x="320" y="18" class="tech-text">JavaScript</text>

    <rect x="385" y="0" width="90" height="36" class="tech-pill glow-cyan"/>
    <circle cx="405" cy="18" r="4" class="dot-cyan"/>
    <text x="440" y="18" class="tech-text">React</text>

    <rect x="490" y="0" width="100" height="36" class="tech-pill glow-cyan"/>
    <circle cx="510" cy="18" r="4" class="dot-cyan"/>
    <text x="550" y="18" class="tech-text">Next.js</text>

    <rect x="605" y="0" width="100" height="36" class="tech-pill glow-cyan"/>
    <circle cx="625" cy="18" r="4" class="dot-cyan"/>
    <text x="665" y="18" class="tech-text">Node.js</text>

    <rect x="720" y="0" width="100" height="36" class="tech-pill glow-pink"/>
    <circle cx="740" cy="18" r="4" class="dot-pink"/>
    <text x="780" y="18" class="tech-text">Tailwind</text>

    <rect x="835" y="0" width="100" height="36" class="tech-pill glow-pink"/>
    <circle cx="855" cy="18" r="4" class="dot-pink"/>
    <text x="895" y="18" class="tech-text">Figma</text>
  </g>

  <!-- Row 2: Infra & tools -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="120" height="36" class="tech-pill glow-cyan"/>
    <circle cx="20" cy="18" r="4" class="dot-cyan"/>
    <text x="70" y="18" class="tech-text">PostgreSQL</text>

    <rect x="135" y="0" width="90" height="36" class="tech-pill glow-cyan"/>
    <circle cx="155" cy="18" r="4" class="dot-cyan"/>
    <text x="190" y="18" class="tech-text">MySQL</text>

    <rect x="240" y="0" width="100" height="36" class="tech-pill glow-purple"/>
    <circle cx="260" cy="18" r="4" class="dot-purple"/>
    <text x="300" y="18" class="tech-text">Docker</text>

    <rect x="355" y="0" width="80" height="36" class="tech-pill glow-purple"/>
    <circle cx="375" cy="18" r="4" class="dot-purple"/>
    <text x="405" y="18" class="tech-text">AWS</text>

    <rect x="450" y="0" width="70" height="36" class="tech-pill glow-pink"/>
    <circle cx="465" cy="18" r="4" class="dot-pink"/>
    <text x="495" y="18" class="tech-text">Git</text>

    <rect x="535" y="0" width="90" height="36" class="tech-pill glow-pink"/>
    <circle cx="555" cy="18" r="4" class="dot-pink"/>
    <text x="590" y="18" class="tech-text">Linux</text>

    <rect x="640" y="0" width="120" height="36" class="tech-pill glow-purple"/>
    <circle cx="660" cy="18" r="4" class="dot-purple"/>
    <text x="710" y="18" class="tech-text">TensorFlow</text>

    <rect x="775" y="0" width="110" height="36" class="tech-pill glow-cyan"/>
    <circle cx="795" cy="18" r="4" class="dot-cyan"/>
    <text x="840" y="18" class="tech-text">PyTorch</text>
  </g>
</svg>
