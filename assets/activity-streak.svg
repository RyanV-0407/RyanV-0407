<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      .border-base {
        fill: none; rx: 20; ry: 20;
        stroke: #18182c; stroke-width: 1.2;
      }
      .border-laser {
        fill: none; rx: 20; ry: 20;
        stroke: url(#laserGrad3); stroke-width: 2;
        stroke-linecap: round; stroke-dasharray: 200 1350;
        animation: laserTravel 7.5s linear infinite;
      }
      @keyframes laserTravel {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -1550; }
      }
      .card-glow {
        fill: #a78bfa; opacity: 0.08;
        animation: glowBreathe 4s ease-in-out infinite;
      }
      @keyframes glowBreathe { 0%,100% { opacity: 0.05; r: 85; } 50% { opacity: 0.12; r: 105; } }
      .label {
        font-family: 'Space Mono', 'Inter', monospace; font-weight: 700; font-size: 13px;
        fill: #a78bfa; letter-spacing: 1.5px;
      }
      .metric-num {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 40px;
        fill: #ffffff; letter-spacing: -0.5px;
      }
      .badge-txt {
        font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
        fill: #a78bfa; letter-spacing: 0.8px;
      }
      .desc {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 13px;
        fill: #9898b0; line-height: 1.6;
      }
    </style>

    <linearGradient id="laserGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="numGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle class="card-glow" cx="90" cy="110" r="90" filter="url(#glow)"/>

  <!-- Card Background -->
  <rect class="card-fill" x="2" y="2" width="576" height="216"/>

  <!-- Base Border -->
  <rect class="border-base" x="2" y="2" width="576" height="216"/>

  <!-- Animated Laser Border -->
  <rect class="border-laser" x="2" y="2" width="576" height="216" filter="url(#glow)"/>

  <!-- Header: Icon & Category -->
  <g transform="translate(30, 26)">
    <!-- Icon Circle -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#1b1233" stroke="#581c87" stroke-width="1"/>
    <text x="11" y="26" font-size="18">🔥</text>

    <!-- Title & Badge -->
    <text class="label" x="52" y="24">DEV STREAK &amp; MOMENTUM</text>

    <!-- Badge -->
    <rect x="365" y="6" width="153" height="24" rx="12" fill="#241344" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="379" cy="18" r="3.5" fill="#a78bfa"/>
    <text class="badge-txt" x="389" y="21.5">DAILY BUILDER</text>
  </g>

  <!-- Big Metric Value -->
  <g transform="translate(30, 85)">
    <text class="metric-num" x="0" y="42" fill="url(#numGrad3)">Active<tspan font-size="28" fill="#a78bfa"> ⚡</tspan></text>
    <text font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#a78bfa" x="180" y="22" letter-spacing="1">CURRENT: 2 DAYS</text>
    <text font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b" x="180" y="40">Peak Continuous Rhythm</text>
  </g>

  <!-- Mini Animated Pulse Beacon Indicator -->
  <g transform="translate(425, 105)">
    <circle cx="16" cy="16" r="14" fill="#a78bfa" opacity="0.15">
      <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="16" r="8" fill="#a78bfa" opacity="0.4"/>
    <circle cx="16" cy="16" r="4.5" fill="#a78bfa"/>
  </g>

  <!-- Description Text -->
  <text class="desc" x="30" y="165">
    Consistent daily engineering cadence, active shipping discipline,
  </text>
  <text class="desc" x="30" y="187">
    and unwavering momentum across ML architecture development.
  </text>
</svg>
