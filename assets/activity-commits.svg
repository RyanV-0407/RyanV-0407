<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      .border-base {
        fill: none; rx: 20; ry: 20;
        stroke: #18182c; stroke-width: 1.2;
      }
      .border-laser {
        fill: none; rx: 20; ry: 20;
        stroke: url(#laserGrad2); stroke-width: 2;
        stroke-linecap: round; stroke-dasharray: 200 1350;
        animation: laserTravel 6.5s linear infinite;
      }
      @keyframes laserTravel {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -1550; }
      }
      .card-glow {
        fill: #f472b6; opacity: 0.08;
        animation: glowBreathe 4s ease-in-out infinite;
      }
      @keyframes glowBreathe { 0%,100% { opacity: 0.05; r: 85; } 50% { opacity: 0.12; r: 105; } }
      .label {
        font-family: 'Space Mono', 'Inter', monospace; font-weight: 700; font-size: 13px;
        fill: #f472b6; letter-spacing: 1.5px;
      }
      .metric-num {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 42px;
        fill: #ffffff; letter-spacing: -1px;
      }
      .badge-txt {
        font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
        fill: #f472b6; letter-spacing: 0.8px;
      }
      .desc {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 13px;
        fill: #9898b0; line-height: 1.6;
      }
    </style>

    <linearGradient id="laserGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="numGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle class="card-glow" cx="90" cy="110" r="90" filter="url(#glow)"/>

  <!-- Card Background -->
  <rect class="card-fill" x="2" y="2" width="576" height="216"/>

  <!-- Base Border -->
  <rect class="border-base" x="2" y="2" width="576" height="216"/>

  <!-- Animated Laser Border -->
  <rect class="border-laser" x="2" y="2" width="576" height="216" filter="url(#glow)"/>

  <!-- Header: Icon & Category -->
  <g transform="translate(30, 26)">
    <!-- Icon Circle -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#200d1b" stroke="#831843" stroke-width="1"/>
    <text x="11" y="26" font-size="18">🚀</text>

    <!-- Title & Badge -->
    <text class="label" x="52" y="24">PRODUCTION COMMITS</text>

    <!-- Badge -->
    <rect x="375" y="6" width="143" height="24" rx="12" fill="#2d0f22" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="389" cy="18" r="3.5" fill="#f472b6"/>
    <text class="badge-txt" x="399" y="21.5">HIGH VELOCITY</text>
  </g>

  <!-- Big Metric Value -->
  <g transform="translate(30, 85)">
    <text class="metric-num" x="0" y="42" fill="url(#numGrad2)">291<tspan font-size="28" fill="#f472b6">+</tspan></text>
    <text font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#f472b6" x="140" y="22" letter-spacing="1">PUSHED COMMITS</text>
    <text font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b" x="140" y="40">Direct Architecture Pushes</text>
  </g>

  <!-- Animated Pulse Commit Dots -->
  <g transform="translate(365, 108)">
    <circle cx="0" cy="8" r="4" fill="#f472b6"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
    <line x1="4" y1="8" x2="16" y2="8" stroke="#37182c" stroke-width="1.5"/>
    <circle cx="20" cy="8" r="4" fill="#fb7185"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <line x1="24" y1="8" x2="36" y2="8" stroke="#37182c" stroke-width="1.5"/>
    <circle cx="40" cy="8" r="4" fill="#f43f5e"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Description Text -->
  <text class="desc" x="30" y="165">
    High deployment cadence driving model training loops, RAG agent logic,
  </text>
  <text class="desc" x="30" y="187">
    multi-horizon time-series pipelines, and production full-stack systems.
  </text>
</svg>
