<svg viewBox="0 0 580 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      .card-bg { fill: #0d0d18; rx: 16; ry: 16; }
      .card-border { fill: none; stroke: #1e1e38; stroke-width: 1; rx: 16; ry: 16; }
      .card-icon { font-size: 28px; }
      .card-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; fill: #f472b6; }
      .card-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #9898b0; }
      .card-accent { fill: #f472b6; opacity: 0.06; }
    </style>
  </defs>
  <rect width="580" height="200" class="card-bg"/>
  <rect width="580" height="200" class="card-border"/>
  <circle cx="50" cy="50" r="80" class="card-accent"/>
  <text x="35" y="50" class="card-icon">📍</text>
  <text x="75" y="48" class="card-label">Base</text>
  <text x="35" y="85" class="card-text">India · Remote-first</text>
  <text x="35" y="120" class="card-icon">💡</text>
  <text x="75" y="118" class="card-label">Principle</text>
  <text x="35" y="155" class="card-text">Build something worth shipping. Keep it clean,</text>
  <text x="35" y="178" class="card-text">scalable, and impactful.</text>
</svg>
