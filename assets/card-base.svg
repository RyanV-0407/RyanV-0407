<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      .card-border {
        fill: none; rx: 20; ry: 20;
        stroke: url(#borderGrad3);
        stroke-width: 1.5;
        stroke-dasharray: 8 4;
        animation: borderRotate 10s linear infinite;
      }
      @keyframes borderRotate { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }

      .card-glow { fill: #f472b6; opacity: 0.06; animation: glowBreathe 4.5s ease-in-out infinite; }
      @keyframes glowBreathe { 0%,100% { opacity: 0.04; r: 90; } 50% { opacity: 0.1; r: 110; } }

      .icon { font-size: 28px; opacity: 0; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards; }
      .icon2 { font-size: 28px; opacity: 0; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards; }
      @keyframes popIn { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

      .label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #f472b6; letter-spacing: 1px; opacity: 0; animation: slideIn 0.6s ease-out 0.3s forwards; }
      .label2 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #a78bfa; letter-spacing: 1px; opacity: 0; animation: slideIn 0.6s ease-out 0.7s forwards; }
      .text { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13.5px; fill: #9898b0; opacity: 0; animation: slideIn 0.6s ease-out 0.5s forwards; }
      .text2 { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13.5px; fill: #9898b0; opacity: 0; animation: slideIn 0.6s ease-out 0.9s forwards; }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

      .divider { stroke: #1e1e38; stroke-width: 0.5; stroke-dasharray: 4 4; }
      .corner-dot { fill: #f472b6; opacity: 0.3; }
    </style>
    <linearGradient id="borderGrad3">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect x="2" y="2" width="576" height="216" class="card-fill"/>
  <circle cx="60" cy="60" r="100" class="card-glow" filter="url(#blur3)"/>
  <rect x="2" y="2" width="576" height="216" class="card-border"/>

  <circle cx="20" cy="20" r="2" class="corner-dot"/>
  <circle cx="560" cy="20" r="2" class="corner-dot"/>
  <circle cx="20" cy="200" r="2" class="corner-dot"/>
  <circle cx="560" cy="200" r="2" class="corner-dot"/>

  <text x="38" y="58" class="icon">📍</text>
  <text x="78" y="55" class="label">Base</text>
  <text x="38" y="88" class="text">India · Remote-first · Open to opportunities</text>

  <line x1="38" y1="108" x2="542" y2="108" class="divider"/>

  <text x="38" y="138" class="icon2">💡</text>
  <text x="78" y="135" class="label2">Principle</text>
  <text x="38" y="168" class="text2">Build something worth shipping. Keep the code</text>
  <text x="38" y="192" class="text2">clean, the architecture scalable, the UI breathtaking.</text>
</svg>
