<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');

      .card-fill { fill: #0c0c16; rx: 20; ry: 20; }
      
      .border-base {
        fill: none; rx: 20; ry: 20;
        stroke: #18182c;
        stroke-width: 1.2;
      }
      .border-laser {
        fill: none; rx: 20; ry: 20;
        stroke: url(#laserGrad3);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 200 1350;
        animation: laserTravel 7s linear infinite;
        animation-delay: -4.6s;
      }
      @keyframes laserTravel {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -1550; }
      }

      .card-glow {
        fill: #f472b6; opacity: 0.07;
        animation: glowBreathe 4.5s ease-in-out infinite;
      }
      @keyframes glowBreathe { 0%,100% { opacity: 0.05; r: 85; } 50% { opacity: 0.11; r: 105; } }

      .icon { font-size: 24px; }

      .label {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 15px;
        fill: #f472b6; letter-spacing: 0.5px;
      }
      .label2 {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 15px;
        fill: #a78bfa; letter-spacing: 0.5px;
      }
      .text {
        font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 13px;
        fill: #9898b0;
      }
      .divider { stroke: #1e1e38; stroke-width: 0.8; stroke-dasharray: 4 4; }

      .corner-dot { fill: #f472b6; opacity: 0.35; }
    </style>

    <linearGradient id="laserGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur3"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="576" height="216" class="card-fill"/>
  <circle cx="60" cy="60" r="90" class="card-glow" filter="url(#blur3)"/>
  
  <!-- Borders: Static base + Smooth Moving Laser Beam -->
  <rect x="2" y="2" width="576" height="216" class="border-base"/>
  <rect x="2" y="2" width="576" height="216" class="border-laser"/>

  <!-- Subtle Corner Dots -->
  <circle cx="20" cy="20" r="2" class="corner-dot"/>
  <circle cx="560" cy="20" r="2" class="corner-dot"/>
  <circle cx="20" cy="200" r="2" class="corner-dot"/>
  <circle cx="560" cy="200" r="2" class="corner-dot"/>

  <!-- Content Part 1: Base -->
  <text x="38" y="52" class="icon">📍</text>
  <text x="74" y="49" class="label">Base</text>
  <text x="38" y="80" class="text">India · Remote-first · Open to global opportunities</text>

  <!-- Divider -->
  <line x1="38" y1="104" x2="542" y2="104" class="divider"/>

  <!-- Content Part 2: Principle -->
  <text x="38" y="138" class="icon">💡</text>
  <text x="74" y="135" class="label2">Principle</text>
  <text x="38" y="166" class="text">Build something worth shipping. Keep the code clean,</text>
  <text x="38" y="188" class="text">the architecture scalable, and the UI breathtaking.</text>
</svg>
